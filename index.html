/* =====================================================================
   GRAND THEFT KIBBUTZ  -  גרנד תאפט קיבוץ
   Top-down chaos in a peaceful kibbutz. No one gets hurt (much).
   ===================================================================== */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let VW=0,VH=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);VW=innerWidth;VH=innerHeight;cv.width=VW*DPR;cv.height=VH*DPR;}
addEventListener('resize',resize);resize();

const rnd=(a,b)=>a+Math.random()*(b-a), rint=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v, dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;}
let seed=777;function srnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
let nid=1;

/* ---------------- INPUT ---------------- */
const keys={}, pressed={}; let mouseDown=false;
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].includes(e.code))e.preventDefault();
  if(!keys[e.code])pressed[e.code]=true; keys[e.code]=true; initAudio();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('mousedown',()=>{mouseDown=true;initAudio();});
addEventListener('mouseup',()=>{mouseDown=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouseDown=false;});
const K=(...c)=>c.some(x=>keys[x]);
const P=(...c)=>c.some(x=>pressed[x]);

/* ---------------- AUDIO ---------------- */
let AC=null,sfxBus,radioBus,noiseBuf,radioOn=true,sfxOn=true;
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
    sfxBus=AC.createGain();sfxBus.gain.value=1;sfxBus.connect(master);
    radioBus=AC.createGain();radioBus.gain.value=0;radioBus.connect(master);
    const n=AC.sampleRate*.6;noiseBuf=AC.createBuffer(1,n,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;}
}
function tone(f,dur,type,vol,slide,delay,bus){
  if(!AC)return; bus=bus||sfxBus; const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);
  g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+.02);
}
function noise(dur,vol,fr){
  if(!AC)return;const t=AC.currentTime;const s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fr||1500;
  const g=AC.createGain();g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(sfxBus);s.start(t);s.stop(t+dur);
}
function snd(name,x,y){
  if(!AC||!sfxOn)return;
  let vol=1;if(x!==undefined){vol=clamp(1-dist(x,y,cam.x,cam.y)/800,0,1);if(vol<.05)return;}
  switch(name){
    case'punch':noise(.1,.35*vol,900);tone(160,.1,'square',.12*vol,60);break;
    case'toto':tone(900,.12,'triangle',.15*vol,300);break;
    case'coin':tone(880,.07,'square',.09*vol);tone(1320,.12,'square',.09*vol,0,.07);break;
    case'crash':noise(.3,.5*vol,700);tone(90,.2,'sawtooth',.2*vol,40);break;
    case'break':noise(.18,.3*vol,2500);break;
    case'splash':noise(.35,.3*vol,3500);break;
    case'moo':tone(130,.6,'sawtooth',.14*vol,85);break;
    case'cluck':tone(700,.05,'square',.06*vol,500);tone(600,.05,'square',.06*vol,0,.07);break;
    case'ding':tone(2200,.25,'sine',.12*vol);tone(2900,.3,'sine',.07*vol,0,.04);break;
    case'hornK':tone(520,.28,'square',.13*vol);tone(660,.28,'square',.1*vol);break;
    case'hornT':tone(110,.55,'sawtooth',.2*vol);tone(138,.55,'sawtooth',.14*vol);break;
    case'hornS':tone(840,.18,'square',.1*vol);break;
    case'hurt':tone(300,.15,'sawtooth',.14*vol,120);break;
    case'win':[523,659,784,1047].forEach((f,i)=>tone(f,.18,'square',.1,0,i*.1));break;
    case'lose':[400,330,260,180].forEach((f,i)=>tone(f,.2,'sawtooth',.1,0,i*.12));break;
    case'alert':tone(700,.1,'square',.1);tone(900,.1,'square',.1,0,.12);break;
  }
}
const midi=n=>440*Math.pow(2,(n-69)/12);
const STATIONS=[null,
 {name:'רדיו הורה FM',bpm:176,base:57,wave:'square',
  mel:[12,11,12,8,7,8,7,3, 0,3,7,8,7,3,0,null, 12,11,12,8,7,8,7,3, 5,3,2,3,0,null,0,null],
  bass:[-12,null,-5,null,-12,null,-5,null]},
 {name:'גלגלי הקיבוץ 88.8',bpm:190,base:52,wave:'triangle',
  mel:[0,null,3,null,5,7,null,5, 3,null,0,null,-2,null,0,null, 0,null,3,null,5,7,null,10, 12,null,10,null,7,null,5,null],
  bass:[-12,-12,null,-12,-9,null,-12,null, -12,-12,null,-12,-7,null,-9,null]}];
let radioSt=1,radioStep=0,radioNext=0;
function radioTick(){
  if(!AC)return;
  const target=(player.veh&&radioSt>0&&radioOn)?1:0;
  radioBus.gain.value+=(target-radioBus.gain.value)*.1;
  if(!radioSt)return;const st=STATIONS[radioSt];const dt=60/st.bpm/2;
  if(radioNext<AC.currentTime)radioNext=AC.currentTime+.05;
  while(radioNext<AC.currentTime+.25){
    const del=radioNext-AC.currentTime;
    const n=st.mel[radioStep%st.mel.length];if(n!==null)tone(midi(n+st.base+12),dt*.9,st.wave,.07,0,del,radioBus);
    const b=st.bass[radioStep%st.bass.length];if(b!==null)tone(midi(b+st.base),dt*.9,'triangle',.13,0,del,radioBus);
    radioStep++;radioNext+=dt;
  }
}

/* ---------------- WORLD ---------------- */
const W=3200,H=2400,CELL=16,GW=W/CELL,GH=H/CELL;
const KX0=480,KY0=380,KX1=2720,KY1=2020;
const T={WILD:0,LAWN:1,ROAD:2,WHEAT:3,PLOW:4,STUBBLE:5,DIRT:6,WATER:7,PLAZA:8,PATH:9,SUN:10,SAND:11};
const terr=new Uint8Array(GW*GH), mud=new Uint8Array(GW*GH);
function rectT(x0,y0,x1,y1,t){
  const a=Math.max(0,Math.floor(x0/CELL)),b=Math.min(GW-1,Math.ceil(x1/CELL)-1),c=Math.max(0,Math.floor(y0/CELL)),d=Math.min(GH-1,Math.ceil(y1/CELL)-1);
  for(let y=c;y<=d;y++)for(let x=a;x<=b;x++)terr[y*GW+x]=t;
}
const tAt=(x,y)=>(x<0||y<0||x>=W||y>=H)?0:terr[((y/CELL)|0)*GW+((x/CELL)|0)];
const inKib=(x,y)=>x>KX0&&x<KX1&&y>KY0&&y<KY1;
const RX=[1100,1600,2100], RY=[800,1200,1600];
const isMainX=x=>x===1600, isMainY=y=>y===1200;

function buildTerrain(){
  rectT(0,0,W,H,T.WILD);
  rectT(40,60,440,1160,T.WHEAT); rectT(40,1240,440,2340,T.PLOW);
  rectT(2760,60,3160,1160,T.SUN); rectT(2760,1240,3160,2340,T.WHEAT);
  rectT(1660,2060,2680,2340,T.PLOW);
  rectT(560,2090,1320,2340,T.DIRT);
  rectT(KX0,KY0,KX1,KY1,T.LAWN);
  // communal plazas
  rectT(1150,990,1580,1172,T.PLAZA); rectT(1675,850,1925,1020,T.PLAZA); rectT(1700,870,1900,1000,T.WATER);
  rectT(1680,1040,1930,1160,T.PLAZA); rectT(1150,1350,1580,1572,T.PLAZA); rectT(1650,1340,1900,1425,T.PLAZA);
  rectT(1930,1350,2070,1560,T.SAND); rectT(1960,880,2060,1000,T.PLAZA);
  // roads: sidewalks then asphalt
  for(const y of RY){const hw=isMainY(y)?24:18;rectT(KX0,y-hw-7,KX1,y+hw+7,T.PATH);}
  for(const x of RX){const hw=isMainX(x)?24:18;rectT(x-hw-7,KY0,x+hw+7,KY1,T.PATH);}
  for(const y of RY){const hw=isMainY(y)?24:18;rectT(KX0,y-hw,KX1,y+hw,T.ROAD);}
  for(const x of RX){const hw=isMainX(x)?24:18;rectT(x-hw,KY0,x+hw,KY1,T.ROAD);}
  // dirt roads through gates
  rectT(0,1180,KX0,1220,T.DIRT); rectT(KX1,1180,W,1220,T.DIRT);
  rectT(1580,0,1620,KY0,T.DIRT); rectT(1580,KY1,1620,H,T.DIRT);
  rectT(1580,2020,1620,2340,T.DIRT);
}
const COL=['#86a553','#6cbb4b','#4b4e54','#d8b84b','#7a5436','#a8894a','#a98456','#37a6d8','#d9cfba','#c9c4b3','#c9ad2a','#e6d49b'];
function bakeCell(g,cx,cy){
  const t=terr[cy*GW+cx],x=cx*CELL,y=cy*CELL;
  const v=(((cx*73856093)^(cy*19349663))>>>0)%100/100;
  g.fillStyle=COL[t];g.fillRect(x,y,CELL,CELL);
  g.fillStyle=v<.5?`rgba(0,0,0,${(.5-v)*.13})`:`rgba(255,255,255,${(v-.5)*.1})`;g.fillRect(x,y,CELL,CELL);
  if(t===T.WHEAT||t===T.SUN){g.fillStyle=t===T.WHEAT?'rgba(120,80,10,.28)':'rgba(70,50,0,.3)';for(let i=0;i<3;i++)g.fillRect(x+2+i*5+(v*3|0),y,1,CELL);
    if(t===T.SUN){g.fillStyle='#5a3a10';g.fillRect(x+6,y+6,4,4);g.fillStyle='#f3d21b';g.fillRect(x+5,y+5,6,1);g.fillRect(x+5,y+10,6,1);}}
  else if(t===T.PLOW){g.fillStyle='rgba(30,15,5,.3)';g.fillRect(x,y+3,CELL,2);g.fillRect(x,y+11,CELL,2);}
  else if(t===T.STUBBLE){g.fillStyle='rgba(70,45,10,.35)';g.fillRect(x,y+4,CELL,1);g.fillRect(x,y+9,CELL,1);g.fillRect(x,y+14,CELL,1);}
  else if(t===T.LAWN&&v>.7){g.fillStyle='rgba(30,100,30,.35)';g.fillRect(x+(v*20|0)%12,y+(v*37|0)%12,1,3);g.fillRect(x+(v*53|0)%12,y+(v*11|0)%12,1,3);}
  else if(t===T.WATER){g.fillStyle='rgba(255,255,255,.25)';g.fillRect(x+(v*10|0),y+(v*7|0)+2,6,1);}
  else if(t===T.PLAZA&&((cx+cy)&1)){g.fillStyle='rgba(0,0,0,.04)';g.fillRect(x,y,CELL,CELL);}
}

/* ---- static solids (buildings) ---- */
const solids=[], objs=[];
const SG=128, sgrid=new Map(), ogrid=new Map();
let qstamp=0;
function gridAdd(map,o,x0,y0,x1,y1){
  for(let cx=Math.floor(x0/SG);cx<=Math.floor(x1/SG);cx++)for(let cy=Math.floor(y0/SG);cy<=Math.floor(y1/SG);cy++){
    const k=cx*4096+cy;let a=map.get(k);if(!a){a=[];map.set(k,a);}a.push(o);}
}
function gridQuery(map,x0,y0,x1,y1,out){
  out.length=0;qstamp++;
  for(let cx=Math.floor(x0/SG);cx<=Math.floor(x1/SG);cx++)for(let cy=Math.floor(y0/SG);cy<=Math.floor(y1/SG);cy++){
    const a=map.get(cx*4096+cy);if(a)for(const o of a)if(o._q!==qstamp){o._q=qstamp;out.push(o);}}
  return out;
}
const qa=[],qb=[],qc=[],qd=[];
function addSolid(x,y,w,h,k,c,label){
  const s={x,y,w,h,cx:x+w/2,cy:y+h/2,hw:w/2,hh:h/2,k,c,label};
  solids.push(s);gridAdd(sgrid,s,x,y,x+w,y+h);return s;
}
function circleVsShape(s,cx,cy,r){
  if(s.hw===undefined){
    const dx=cx-s.x,dy=cy-s.y,rr=r+s.r,d2=dx*dx+dy*dy;if(d2>=rr*rr)return null;
    const d=Math.sqrt(d2)||.001;return{nx:dx/d,ny:dy/d,pen:rr-d};
  }
  const px=clamp(cx,s.cx-s.hw,s.cx+s.hw),py=clamp(cy,s.cy-s.hh,s.cy+s.hh),dx=cx-px,dy=cy-py,d2=dx*dx+dy*dy;
  if(d2>=r*r)return null;
  if(d2<1e-6){const ox=s.hw-Math.abs(cx-s.cx),oy=s.hh-Math.abs(cy-s.cy);
    if(ox<oy)return{nx:cx<s.cx?-1:1,ny:0,pen:ox+r};return{nx:0,ny:cy<s.cy?-1:1,pen:oy+r};}
  const d=Math.sqrt(d2);return{nx:dx/d,ny:dy/d,pen:r-d};
}
function overlapsSolids(x,y,r){
  gridQuery(sgrid,x-r,y-r,x+r,y+r,qd);for(const s of qd)if(circleVsShape(s,x,y,r))return true;return false;
}

/* ---- destructible objects ---- */
const OT={
  bush:{r:11,need:0,val:5,solid:false,burst:['#3f8f3a','#2f7a32','#5fb24a']},
  flower:{r:9,need:0,val:5,solid:false,burst:['#ff6b9a','#ffd23f','#fff']},
  mailbox:{r:5,need:0,val:10,solid:false,burst:['#3b6ea8','#c33']},
  bin:{r:7,need:0,val:10,solid:false,burst:['#777','#999','#cde']},
  gnome:{r:4,need:0,val:15,solid:false,burst:['#d33','#2a6','#fdc']},
  cloth:{w:46,h:8,need:0,val:15,solid:false,burst:['#fff','#9cf','#fc9']},
  fence:{need:1,val:10,solid:true,burst:['#eee3cc','#d9ccb0']},
  lamp:{r:4,need:2,val:20,solid:true,burst:['#555','#ffe58a']},
  tree:{r:10,need:4,val:40,solid:true,burst:['#2e7d32','#43a047','#6d4c2a']},
  orchard:{r:8,need:4,val:25,solid:true,burst:['#2e7d32','#fb8c00','#6d4c2a']},

  green:{w:110,h:56,need:3,val:120,solid:true,burst:['#bfe6f5','#fff','#8cc']},
};
function addObj(t,x,y,o){
  const d=OT[t];const ob=Object.assign({t,x,y,broken:false,solid:d.solid,need:d.need,val:d.val,rot:Math.random()*6.28,tint:Math.random()},d,o||{});
  if(ob.w){ob.cx=x;ob.cy=y;ob.hw=ob.w/2;ob.hh=ob.h/2;gridAdd(ogrid,ob,x-ob.hw,y-ob.hh,x+ob.hw,y+ob.hh);}
  else gridAdd(ogrid,ob,x-ob.r,y-ob.r,x+ob.r,y+ob.r);
  objs.push(ob);return ob;
}
function addFence(x,y,horiz,col){addObj('fence',x,y,horiz?{w:40,h:6}:{w:6,h:40});}

/* ---- road graph ---- */
const nodes=[],nk=new Map(),links=[];
function node(x,y){const k=x+','+y;if(!nk.has(k)){const n={x,y,nb:[]};nk.set(k,n);nodes.push(n);}return nk.get(k);}
function link(a,b,hw){a.nb.push({n:b,hw});b.nb.push({n:a,hw});links.push({a,b,hw});}
function buildGraph(){
  const HX=[500,1100,1600,2100,2700],VY=[400,800,1200,1600,2000];
  for(const y of RY)for(let i=0;i<HX.length-1;i++)link(node(HX[i],y),node(HX[i+1],y),isMainY(y)?24:18);
  for(const x of RX)for(let i=0;i<VY.length-1;i++)link(node(x,VY[i]),node(x,VY[i+1]),isMainX(x)?24:18);
}
function nearestNode(x,y){let b=null,bd=1e12;for(const n of nodes){const d=(n.x-x)**2+(n.y-y)**2;if(d<bd){bd=d;b=n;}}return b;}
function laneTarget(a,b,hw,off){ // point near b on right-hand side of a->b
  const dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1;return{x:b.x+(-dy/l)*off,y:b.y+(dx/l)*off};
}

/* ---- world population ---- */
const POIS=[
 {x:1295,y:1004,n:'חדר האוכל'},{x:1810,y:1040,n:'הבריכה'},{x:1465,y:1364,n:'המכולת'},{x:1245,y:1388,n:'המזכירות'},
 {x:1245,y:1550,n:'המרפאה'},{x:2015,y:1388,n:'גן הילדים'},{x:830,y:2252,n:'הרפת'},{x:1600,y:430,n:'השער הצפוני'},
 {x:1600,y:1975,n:'השער הדרומי'},{x:520,y:1200,n:'השער המערבי'},{x:2680,y:1200,n:'השער המזרחי'},{x:240,y:640,n:'שדה החיטה'},{x:2960,y:1800,n:'שדה הקיץ'}];

  // kibbutz fence

  // central lawn stuff
  for(const [x,y] of [[1150,840],[1560,850],[1560,1130],[1150,1160],[1690,1240],[2060,1240],[1580,1400],[1150,1590],[2080,1580],[1640,1590]])addObj('tree',x,y);
  for(let i=0;i<14;i++)addObj('bush',rnd(1160,1560),rnd(1010,1160));
  for(let i=0;i<8;i++)addObj('flower',rnd(1330,1560),rnd(1050,1160));
  for(const [x,y] of [[1340,1020],[1500,1020],[1700,1160],[1925,1160],[1250,1560],[1560,1560],[1960,1570]])addObj('lamp',x,y);
  for(const [x,y] of [[1990,1450],[2030,1500],[2000,1530]])addObj('flower',x,y);
  // fields

function vehCircles(v){

function vehPhysics(v,dt,ctrl){
  const d=v.d;if(v.dead||v.stun>0){ctrl={thr:0,steer:0,hb:false};}
  const c=Math.cos(v.a),s=Math.sin(v.a);let vf=v.vx*c+v.vy*s,vl=-v.vx*s+v.vy*c;
  if(ctrl.thr>0){ if(vf<-5)vf+=d.brake*dt; else vf+=d.acc*dt*ctrl.thr*(1-Math.max(0,vf)/d.maxF*.92); }
  else if(ctrl.thr<0){ if(vf>5)vf-=d.brake*dt; else vf-=d.acc*.6*dt*(1-Math.max(0,-vf)/(d.maxF*.4)); }
  else vf*=Math.exp(-(v.driver?.9:3.2)*dt);
  if(ctrl.hb)vf*=Math.exp(-2.4*dt);
  vf=clamp(vf,-d.maxF*.42,d.maxF);
  vl*=Math.exp(-d.grip*(ctrl.hb?.2:1)*dt);
  v.steer+=(ctrl.steer-v.steer)*Math.min(1,dt*9);
  v.a+=v.steer*d.turn*dt*clamp(vf/70,-1,1)/(1+Math.abs(vf)/d.maxF*.6)*(ctrl.hb?1.5:1);
  const c2=Math.cos(v.a),s2=Math.sin(v.a);
  v.vx=vf*c2-vl*s2;v.vy=vf*s2+vl*c2;v.x+=v.vx*dt;v.y+=v.vy*dt;v.vf=vf;
}

function vehStatic(v){
  const cs=vehCircles(v);let nxs=0,nys=0;const sp=Math.hypot(v.vx,v.vy);
  for(const c of cs){
    gridQuery(sgrid,c.x-c.r,c.y-c.r,c.x+c.r,c.y+c.r,qa);
    for(const s of qa){const k=circleVsShape(s,c.x,c.y,c.r);if(k){v.x+=k.nx*k.pen;v.y+=k.ny*k.pen;c.x+=k.nx*k.pen;c.y+=k.ny*k.pen;nxs+=k.nx;nys+=k.ny;}}

    }
  }

  if(nxs||nys){const n=Math.hypot(nxs,nys)||1,nx=nxs/n,ny=nys/n,vn=v.vx*nx+v.vy*ny;
    if(vn<0){v.vx-=vn*nx*1.3;v.vy-=vn*ny*1.3;impact(v,-vn);}}

  }
}
function vehVsVeh(act){
  for(let i=0;i<act.length;i++)for(let j=i+1;j<act.length;j++){
    const a=act[i],b=act[j];if(dist(a.x,a.y,b.x,b.y)>(a.d.L+b.d.L)/2+8)continue;
    const ca=vehCircles(a),cb=vehCircles(b);let done=false;
    for(const x of ca){if(done)break;for(const y of cb){
      const dx=x.x-y.x,dy=x.y-y.y,d=Math.hypot(dx,dy),rr=x.r+y.r;if(d>=rr)continue;
      const nx=d?dx/d:1,ny=d?dy/d:0,pen=rr-d,ma=a.d.mass,mb=b.d.mass,wa=mb/(ma+mb);
      a.x+=nx*pen*wa;a.y+=ny*pen*wa;b.x-=nx*pen*(1-wa);b.y-=ny*pen*(1-wa);
      const rv=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
      if(rv<0){const j2=-(1.3)*rv/(1/ma+1/mb);a.vx+=nx*j2/ma;a.vy+=ny*j2/ma;b.vx-=nx*j2/mb;b.vy-=ny*j2/mb;
        const is=-rv;if(is>70){a.hp-=(is-70)*.08*mb/(ma+mb)*1.6;b.hp-=(is-70)*.08*ma/(ma+mb)*1.6;snd('crash',a.x,a.y);
          if(a.hp<=0&&!a.dead)killVeh(a);if(b.hp<=0&&!b.dead)killVeh(b);if(a.driver==='player'||b.driver==='player')G.shake=Math.min(8,G.shake+is/50);}
        if(is>40){a.blocked=0;b.blocked=0;}}
      done=true;break;}}
  }
}

function koPed(p,byPlayer,t){
  if(p.state==='ko')return;
  p.state='ko';p.timer=t||(p.type==='elder'?5:6.5);p.sayL=0;
  if(byPlayer){G.kos++;
    addScore(p.type==='elder'?8:12,p.x,p.y);
    const n=rint(1,3);for(let i=0;i<n;i++)coins.push({x:p.x+rnd(-14,14),y:p.y+rnd(-14,14),v:pick([5,5,10]),life:25});
    crime(p.type==='elder'?2.4:1.3,p.x,p.y);

  }
}
function hitPed(p,dmg,kx,ky,byPlayer){
  if(p.state==='ko'||p.veh)return;
  if(p.type==='chicken'){p.state='flee';p.timer=2.5;p.fx=kx;p.fy=ky;snd('cluck',p.x,p.y);burst(p.x,p.y,['#fff','#eee'],4,50,2);return;}
  if(p.type==='cow'){snd('moo',p.x,p.y);say(p,'!מוווו',1.4);p.vx+=kx*60;p.vy+=ky*60;return;}
  p.hp-=dmg;p.vx=kx*160;p.vy=ky*160;burst(p.x,p.y,['#fff','#ffe14a'],5,70,3);
  if(p.hp<=0){koPed(p,byPlayer);}

    if(p.brawl&&byPlayer){p.state='fight';p.timer=8;say(p,'!מה אתה רוצה ממני',1.5);}
    else{p.state='flee';p.timer=4;p.fx=kx;p.fy=ky;say(p,pick(['!אוי','!עזרה','!מה פתאום']),1.3);}
  }
}
function pedHitByVehicle(p,v,sp){
  if(p.state==='ko')return;
  const dx=p.x-v.x,dy=p.y-v.y,d=Math.hypot(dx,dy)||1;
  if(p.type==='chicken'){hitPed(p,1,dx/d,dy/d,false);return;}
  if(p.type==='cow'){p.vx+=v.vx*.25;p.vy+=v.vy*.25;snd('moo',p.x,p.y);say(p,'!מוווו',1.4);v.vx*=.8;v.vy*=.8;return;}
  p.vx=v.vx*1.3+dx/d*60;p.vy=v.vy*1.3+dy/d*60;
  const byP=v.driver==='player';
  koPed(p,byP,p.type==='elder'?5:7);
  if(byP){addScore(6,p.x,p.y);}
  snd('punch',p.x,p.y);burst(p.x,p.y,['#fff','#ffe14a'],6,90,3);
  if(!byP&&v.ai==='chase'){/* chaser knocks pedestrian: nothing */}
}
function hurtPlayer(dmg,fromx,fromy){
  if(player.out>0||player.flash>0)return;
  player.hp-=dmg;player.flash=.35;snd('hurt');G.shake=Math.min(8,G.shake+3);

/* ---------------- VEHICLE ENTER/EXIT ---------------- */
function enterVehicle(v){
  if(v.dead){msg('...הרכב הזה כבר לא יזוז','#ffb36b');return;}
  if(v.driver&&v.driver!=='player'){
    const d=v.driver;d.veh=null;d.x=v.x+Math.cos(v.a+1.57)*(v.d.Wd/2+12);d.y=v.y+Math.sin(v.a+1.57)*(v.d.Wd/2+12);
    koPed(d,true,4.5);if(v.ai==='chase'){}else crime(1.4,v.x,v.y);
    say(d,'!גנב! אופניים! קלנועית!',2);v.driver=null;
  }
  v.ai=null;v.driver='player';player.veh=v;
  snd(v.type==='bike'?'ding':'hornS',v.x,v.y);
  if(v.type==='tractor'&&v.frenzy&&G.frenzy<=0){v.frenzy=false;G.frenzy=60;G.frenzyN=0;G.frenzyV=v;banner('!בלגן בשדה','60 שניות - כל הרס שווה כפול. שבור 25 דברים לבונוס',"#9be26b");snd('win');}
  else msg(`נכנסת ל${v.d.name}`,'#cfe');
}
function exitVehicle(){
  const v=player.veh;if(!v)return;
  const sides=[1,-1,2,-2];
  for(const sd of sides){
    const off=(v.d.Wd/2+11);const ang=v.a+(sd>0?1.57:-1.57)*(Math.abs(sd)===1?1:0)+(Math.abs(sd)===2?(sd>0?3.14:0):0);
    const x=v.x+Math.cos(ang)*off,y=v.y+Math.sin(ang)*off;
    if(!blockedAt(x,y,7)){player.x=x;player.y=y;break;}
    player.x=v.x+Math.cos(ang)*(off+14);player.y=v.y+Math.sin(ang)*(off+14);
  }
  v.driver=null;player.veh=null;player.vx=player.vy=0;
}

/* ---------------- AI ---------------- */
function aiWander(v,dt){
  const ctrl=vehCtrl(v);
  if(!v.node||v.ai==='release'){v.node=nearestNode(v.x,v.y);v.prev=null;v.tgt={x:v.node.x,y:v.node.y};v.ai='wander';}
  if(dist(v.x,v.y,v.tgt.x,v.tgt.y)<40){
    const n=v.node;let opts=n.nb.filter(e=>e.n!==v.prev);const dead=!opts.length;if(dead)opts=n.nb;const e=pick(opts);
    v.prev=n;v.node=e.n;v.tgt=laneTarget(n,e.n,e.hw,e.hw*.5);
  }
  const desired=Math.atan2(v.tgt.y-v.y,v.tgt.x-v.x),diff=angDiff(v.a,desired);
  ctrl.steer=clamp(diff*2.4,-1,1);
  const cruise=v.d.maxF*(v.type==='bike'?.5:.42);const vf=v.vf||0;
  ctrl.thr=Math.abs(diff)>.9?(vf>40?-.3:.4):(vf<cruise?1:0);
  ctrl.hb=false;
  // obstacle ahead
  const fx=Math.cos(v.a),fy=Math.sin(v.a),la=v.d.L/2+26;let blocked=false;
  for(const o of vehicles){if(o===v||o.dead&&false)continue;if(Math.abs(o.x-v.x)>90||Math.abs(o.y-v.y)>90)continue;
    if(dist(v.x+fx*la,v.y+fy*la,o.x,o.y)<o.d.Wd/2+v.d.Wd/2+8){blocked=true;break;}}
  if(!blocked)for(const p of peds){if(p.veh)continue;if(Math.abs(p.x-v.x)>90||Math.abs(p.y-v.y)>90)continue;if(dist(v.x+fx*la,v.y+fy*la,p.x,p.y)<v.d.Wd/2+p.r+10){blocked=true;break;}}
  if(!blocked&&player.veh!==v&&!player.veh&&dist(v.x+fx*la,v.y+fy*la,player.x,player.y)<v.d.Wd/2+14)blocked=true;
  if(blocked){ctrl.thr=vf>10?-1:0;v.blocked+=dt;}else v.blocked=Math.max(0,v.blocked-dt);
  if(v.blocked>3.5){v.rev=1.2;v.blocked=0;}
  if(v.rev>0){v.rev-=dt;ctrl.thr=-1;ctrl.steer=-ctrl.steer;if(v.rev<=0&&v.node){v.prev=v.node;}}
  // stuck against wall
  if((v.vf||0)<8&&!blocked){v.stuckT+=dt;if(v.stuckT>2.5){v.rev=1;v.stuckT=0;}}else v.stuckT=0;
}
function aiChase(v,dt){
  const ctrl=vehCtrl(v);const tx=player.veh?player.veh.x:player.x,ty=player.veh?player.veh.y:player.y;
  let desired=Math.atan2(ty-v.y,tx-v.x);const fx=Math.cos(v.a),fy=Math.sin(v.a);
  const probe=(ang)=>blockedAt(v.x+Math.cos(ang)*(v.d.L/2+24),v.y+Math.sin(ang)*(v.d.L/2+24),9);

function updatePed(p,dt){

  let mx=0,my=0,spd=p.spd;
  switch(p.state){
    case'ko':{p.timer-=dt;if(p.timer<=0){
        p.hp=p.maxhp;p.wet=0;
        if(p.type==='elder'){p.state='walk';say(p,pick(['הו הו הו... מה זה היה','!אני מתלונן בוועד','אוי, הגב שלי']),2);}

    case'flee':{

      else{ if(!dx&&!dy){dx=p.x-player.x;dy=p.y-player.y;} }
      const l=Math.hypot(dx,dy)||1;mx=dx/l;my=dy/l;spd=p.type==='chicken'?120:p.spd*1.9;
      if(p.timer<=0){p.state=p.type==='chicken'?'peck':'walk';p.node=null;p.timer=rnd(1,3);if(p.type!=='chicken')pedPickTarget(p);}
      break;}
    case'fight':{
      p.timer-=dt;const dx=player.x-p.x,dy=player.y-p.y,l=Math.hypot(dx,dy)||1;spd=p.spd*1.7;mx=dx/l;my=dy/l;

    case'chase':{

      const dx=px-p.x,dy=py-p.y,l=Math.hypot(dx,dy)||1;spd=p.type==='elder'?78:84;mx=dx/l;my=dy/l;
      if(l<18&&p.cd<=0&&player.out<=0&&!player.veh){p.cd=1.1;hurtPlayer(5,p.x,p.y);say(p,'!הנה לך מקל',.9);}

    case'peck':{p.timer-=dt;if(p.type==='chicken'){if(dist(p.x,p.y,player.x,player.y)<60){p.state='flee';p.timer=2;p.fx=p.x-player.x;p.fy=p.y-player.y;snd('cluck',p.x,p.y);}
        else if(p.timer<=0){p.state='wander';p.timer=rnd(.5,1.5);p.fx=rnd(-1,1);p.fy=rnd(-1,1);}}break;}
    case'wander':{p.timer-=dt;mx=p.fx;my=p.fy;spd=28;if(p.timer<=0){p.state='peck';p.timer=rnd(1,4);}break;}
    case'graze':{p.timer-=dt;if(p.timer<=0){p.state='graze2';p.timer=rnd(1,3);p.fx=rnd(-1,1);p.fy=rnd(-1,1);if(Math.random()<.3)snd('moo',p.x,p.y);}break;}
    case'graze2':{p.timer-=dt;mx=p.fx;my=p.fy;spd=16;if(p.timer<=0){p.state='graze';p.timer=rnd(2,6);}
      if(p.x<1030)p.fx=1;if(p.x>1270)p.fx=-1;if(p.y<2130)p.fy=1;if(p.y>2270)p.fy=-1;break;}

  }

  p.x+=p.vx*dt;p.y+=p.vy*dt;

}

  if(G.level===0){for(const q of peds)if(q.state==='chase'){q.state='walk';q.node=null;pedPickTarget(q);}
    for(const v of vehicles){if(v.ai==='chase')v.ai='release';}}
  // grab / bust
  let grabbing=0;const psp=p.veh?Math.hypot(p.veh.vx,p.veh.vy):Math.hypot(p.vx,p.vy);
  if(G.level>0&&p.out<=0&&psp<55){
    for(const q of peds)if(q.state==='chase'&&dist(q.x,q.y,p.x,p.y)<24)grabbing++;
    for(const v of vehicles)if(v.ai==='chase'&&dist(v.x,v.y,p.x,p.y)<v.d.L/2+22)grabbing++;
  }
  if(grabbing>0)G.grab+=dt*.75*Math.min(grabbing,3);else G.grab=Math.max(0,G.grab-dt*1.5);

}

  // messages
  let my=G.mission||G.frenzy>0?112:56;
  for(const m2 of G.msgs){ctx.globalAlpha=Math.min(1,m2.life);T_(m2.t,VW/2,my,15,m2.col,'center',true,'rtl');ctx.globalAlpha=1;my+=22;}
  // banner
  if(G.banner){const b=G.banner;ctx.globalAlpha=Math.min(1,b.life*1.5);T_(b.t,VW/2,VH*.32,44,b.col,'center',true,'rtl');T_(b.sub,VW/2,VH*.32+42,18,'#fff','center',true,'rtl');ctx.globalAlpha=1;}
  // out overlay
  if(player.out>0){const a=Math.min(.8,(player.outT==='faint'?3.2:3.6)-player.out>.4?.8:.8);ctx.fillStyle='rgba(0,0,0,'+a*Math.min(1,(3.4-player.out)*2)+')';ctx.fillRect(0,0,VW,VH);}
  if(player.hp<30&&player.out<=0){ctx.fillStyle='rgba(255,0,0,'+(.12+.08*Math.sin(G.time*6))+')';ctx.fillRect(0,0,VW,VH);}
}
function drawStar(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.42:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=1;ctx.stroke();}

/* ---------------- TITLE ---------------- */
function drawTitle(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const g=ctx.createLinearGradient(0,0,0,VH);g.addColorStop(0,'#58b8f0');g.addColorStop(.55,'#bfe8ff');g.addColorStop(.55,'#6cbb4b');g.addColorStop(1,'#3f8f3a');ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,VW,VH);
  const cx=VW/2;
  const tz=Math.min(1,VW/760);
  ctx.save();ctx.translate(cx,VH*.2);ctx.scale(tz,tz);
  ctx.rotate(-.03);T_('GRAND THEFT',0,-34,54,'#ffe14a','center',true,'ltr');T_('KIBBUTZ',0,22,84,'#ff9b3a','center',true,'ltr');
  ctx.restore();
  T_('גרנד תאפט קיבוץ',cx,VH*.2+86*tz,34*Math.max(.6,tz),'#fff','center',true,'rtl');
  T_('"הדשא של השכן ירוק יותר. עד שעוברים עליו עם טרקטור"',cx,VH*.2+130*tz,16,'#e9f6ff','center',false,'rtl');
  const L=['WASD / חיצים  —  הליכה ונהיגה       Shift  —  ריצה       Space  —  בלם יד',
           'E  —  כניסה/יציאה מרכב, טלפונים וחנויות       H / J  —  צופר (ברכב)',
           'J / Ctrl / עכבר  —  אגרוף / ירי       Q  —  החלפת נשק       R  —  רדיו       M / N  —  השתקה',
           'סעו על הדשא והזקנים יתחילו לרדוף אחריכם. תלכו להתחבא במוסך של שלומי.',
           'אף אחד לא נפגע באמת: מי שחוטף — מתעלף כמה שניות ומשאיר מטבעות.'];
  L.forEach((s,i)=>T_(s,cx,VH*.52+i*28,Math.max(12,Math.min(17,VW/60)),'#fff','center',false,'rtl'));
  const blink=Math.floor(performance.now()/500)%2;
  if(blink)T_('לחצו Enter או לחיצה כדי להתחיל',cx,VH*.86,26,'#ffe14a','center',true,'rtl');
}

/* ---------------- LOOP ---------------- */
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000;last=now;dt=Math.min(dt,.05);
  if(G.state==='title'){drawTitle();if(P('Enter','Space','KeyE')||mouseDown){G.state='play';mouseDown=false;initAudio();banner('ברוכים הבאים לקיבוץ','תיהנו מהשקט. בינתיים.','#ffe14a');}}
  else{
    if(P('KeyP')){G.state=G.state==='pause'?'play':'pause';}
    if(G.state==='play')update(dt);
    draw();
    if(G.state==='pause'){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,VW,VH);T_('מושהה — P להמשך',VW/2,VH/2,40,'#fff','center',true,'rtl');}
  }
  for(const k in pressed)pressed[k]=false;
  requestAnimationFrame(loop);
}

/* ---------------- BOOT ---------------- */
buildTerrain();buildGraph();buildWorld();bakeWorld();spawnPopulation();
requestAnimationFrame(loop);
</script>
